# ============================================================
# Student Management System - Application Properties
# ============================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/
spring.application.name=Student Management System

# ============================================================
# PostgreSQL Database Configuration
# ============================================================
# Database: student_management_db
# Username: root
# Password: root

spring.datasource.url=jdbc:postgresql://localhost:5432/practice_sql
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA and Hibernate Configuration
# ============================================================

# Hibernate dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DDL auto: update - automatically updates schema on startup
# Options: create-drop, create, update, validate, none
spring.jpa.hibernate.ddl-auto=update

# Show SQL in logs
spring.jpa.show-sql=false

# Format SQL for better readability in logs
spring.jpa.properties.hibernate.format_sql=true

# Use named parameter instead of positional parameters
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================================
# Logging Configuration
# ============================================================

# Root logger level
logging.level.root=INFO

# Application package logging level
logging.level.com.studentmgmt=DEBUG

# Spring Web logging
logging.level.org.springframework.web=INFO

# Spring Security logging (if added later)
logging.level.org.springframework.security=DEBUG

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG

# Hibernate parameter binding logging
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log pattern for console output
# Format: timestamp - logger name - log level - message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Log file configuration
logging.file.name=logs/application.log

# Log file pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file max size before rolling (in MB)
logging.file.max-size=10MB

# Total log backup history to keep
logging.file.max-history=10

# ============================================================
# Jackson Configuration (JSON serialization)
# ============================================================

# Serialize dates as ISO-8601 format
spring.jackson.serialization.write-dates-as-timestamps=false

# Include non-null fields only
spring.jackson.default-property-inclusion=non_null

# ============================================================
# Spring MVC Configuration
# ============================================================

# Include stacktrace in error responses for development
server.error.include-stacktrace=on_param

# Include message in error responses
server.error.include-message=always

# Include binding errors
server.error.include-binding-errors=always

