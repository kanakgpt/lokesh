<!-- Registration Form Component -->
<section id="registerForm" class="form-section hidden">
    <div class="form-container">
        <div class="form-header">
            <h2 id="formTitle">Register New Student</h2>
            <button class="close-btn" onclick="resetForm()">✕</button>
        </div>

        <form id="studentForm" class="student-form">
            <input type="hidden" id="studentId" value="">

            <div class="form-group">
                <label for="firstName">First Name <span class="required">*</span></label>
                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="Enter first name"
                    required
                >
                <span class="error-message" id="firstNameError"></span>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name <span class="required">*</span></label>
                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Enter last name"
                    required
                >
                <span class="error-message" id="lastNameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number <span class="required">*</span></label>
                <input
                    type="tel"
                    id="phoneNumber"
                    name="phoneNumber"
                    placeholder="Enter phone number"
                    required
                >
                <span class="error-message" id="phoneNumberError"></span>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input
                    type="date"
                    id="dateOfBirth"
                    name="dateOfBirth"
                >
                <span class="error-message" id="dateOfBirthError"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <span id="submitBtnText">Register Student</span>
                </button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()">Cancel</button>
            </div>
        </form>
    </div>
</section>
