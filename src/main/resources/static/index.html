<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Registration & Management</title>
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/list.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Navigation Bar -->
    <div id="navbar-placeholder"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Hero Section -->
        <section id="home" class="hero-section">
            <div class="hero-content">
                <h2>Welcome to Student Management System</h2>
                <p>Manage student information efficiently with our modern application</p>
                <button class="btn btn-primary" onclick="showSection('registerForm')">Register New Student</button>
                <button class="btn btn-secondary" onclick="showSection('studentList')">View All Students</button>
            </div>
        </section>

        <!-- Registration Form Section -->
        <div id="register-form-placeholder"></div>

        <!-- Students List Section -->
        <div id="student-list-placeholder"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Modal for Delete Confirmation -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <h3>Confirm Delete</h3>
            <p id="deleteMessage">Are you sure you want to delete this student?</p>
            <div class="modal-actions">
                <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Student Management System | Built with HTML5, CSS3 & JavaScript | API: Spring Boot 3.3.0</p>
    </footer>

    <!-- Initialize placeholder functions to prevent errors during loading -->
    <script>
        // Placeholder functions that will be replaced after module loads
        window.showSection = function(sectionId) {
            console.log('showSection called before module load:', sectionId);
            if (window._mainModuleReady) {
                window._showSectionImpl(sectionId);
            }
        };
        window.resetForm = function() {
            console.log('resetForm called before module load');
            if (window._mainModuleReady) {
                window._resetFormImpl();
            }
        };
        window.handleFormSubmit = function(event) {
            console.log('handleFormSubmit called before module load');
            if (window._mainModuleReady) {
                window._handleFormSubmitImpl(event);
            }
        };
        window.confirmDelete = function() {
            console.log('confirmDelete called before module load');
            if (window._mainModuleReady) {
                window._confirmDeleteImpl();
            }
        };
        window.closeDeleteModal = function() {
            console.log('closeDeleteModal called before module load');
            if (window._mainModuleReady) {
                window._closeDeleteModalImpl();
            }
        };
        window.handleSearch = function() {
            console.log('handleSearch called before module load');
            if (window._mainModuleReady) {
                window._handleSearchImpl();
            }
        };
        window._mainModuleReady = false;
    </script>

    <!-- Logic to Load Components and Main App -->
    <script type="module">
        async function loadComponent(id, path) {
            const response = await fetch(path);
            const text = await response.text();
            document.getElementById(id).outerHTML = text;
        }

        async function init() {
            try {
                // Load all components first
                await Promise.all([
                    loadComponent('navbar-placeholder', 'components/navbar.html'),
                    loadComponent('register-form-placeholder', 'components/register-form.html'),
                    loadComponent('student-list-placeholder', 'components/student-list.html')
                ]);

                // Import main module which sets up the entire application
                const mainModule = await import('./js/main.js');

                // Store real implementations
                window._showSectionImpl = mainModule.ui.showSection;
                window._resetFormImpl = mainModule.resetForm;
                window._handleFormSubmitImpl = mainModule.handleFormSubmit;
                window._confirmDeleteImpl = mainModule.confirmDelete;
                window._closeDeleteModalImpl = mainModule.closeDeleteModal;
                window._handleSearchImpl = mainModule.handleSearch;

                // Replace placeholder functions with real implementations
                window.showSection = mainModule.ui.showSection;
                window.resetForm = mainModule.resetForm;
                window.handleFormSubmit = mainModule.handleFormSubmit;
                window.confirmDelete = mainModule.confirmDelete;
                window.closeDeleteModal = mainModule.closeDeleteModal;
                window.handleSearch = mainModule.handleSearch;
                window.initApp = mainModule.initApp;

                // Mark module as ready
                window._mainModuleReady = true;

                // Initialize the application
                mainModule.initApp();

                console.log('✓ Application initialized successfully');
            } catch (error) {
                console.error('✗ Failed to initialize application:', error);
                alert('Failed to initialize application. Please refresh the page. Error: ' + error.message);
            }
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
